<!DOCTYPE html>
<html>
<head>
  <title>Excel Data Search</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
  <style>
    #searchBox {
      margin: 20px 0;
      padding: 10px;
      width: 100%;
      border: 2px solid #ddd;
      border-radius: 4px;
    }
    .no-results {
      color: red;
      padding: 10px;
    }
  </style>
</head>
<body>
  <div class="container mt-4">
    <h1 class="mb-4">Excel Data Search</h1>
    <input type="file" id="fileInput" accept=".xlsx,.xls" class="form-control mb-3">
    <input type="text" id="searchBox" placeholder="Type to search across all columns..." class="form-control">
    
    <div id="noResults" class="no-results" style="display:none">No matching records found</div>
    
    <table id="dataTable" class="table table-striped mt-3">
      <thead class="table-dark">
        <tr>
          <th>ID</th>
          <th>Employee ID</th>
          <th>Name</th>
          <th>Start Time</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- JavaScript -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
